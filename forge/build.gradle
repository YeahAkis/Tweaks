plugins {
    id 'java'
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin' version '0.7.+'
}

base {
    archivesName = "${rootProject.mod_id}-forge"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
}

minecraft {
    mappings channel: 'official', version: rootProject.minecraft_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        server {
            args '--nogui', '-mixin.config=tweaks.mixins.json'
            mods {
                "${rootProject.mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'tweaks.refmap.json'
    config 'tweaks.mixins.json'
}

repositories {
    maven {
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

processResources {
    def props = [
            version  : project.version,
            minecraft: rootProject.minecraft_version,
            forge    : rootProject.forge_version.split('\\.')[0]
    ]
    inputs.properties props
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}

jar {
    manifest {
        attributes 'MixinConfigs': 'tweaks.mixins.json'
    }
    finalizedBy 'reobfJar'
}

ext.publishFile = tasks.jar.archiveFile
ext.publishSuffix = 'forge'
ext.publishLabel = 'Forge'
ext.publishLoaders = ['forge']
apply from: '../gradle/publish.gradle'
