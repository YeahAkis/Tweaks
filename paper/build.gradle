plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.17'
}

base {
    archivesName = "${rootProject.mod_id}-paper"
}

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    paperweight.paperDevBundle("${rootProject.paper_version}-R0.1-SNAPSHOT")
}

paperweight.reobfArtifactConfiguration = io.papermc.paperweight.userdev.ReobfArtifactConfiguration.getREOBF_PRODUCTION()

tasks.assemble {
    dependsOn tasks.reobfJar
}

processResources {
    def props = [
            version: project.version,
            api    : rootProject.paper_api
    ]
    inputs.properties props
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

ext.publishFile = tasks.named('reobfJar').flatMap { it.outputJar }
ext.publishSuffix = 'paper'
ext.publishLabel = 'Paper and Folia'
ext.publishLoaders = ['paper', 'folia', 'purpur']
apply from: '../gradle/publish.gradle'
